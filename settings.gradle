pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
    plugins {
        id 'com.android.library' version '9.0.0-rc02'
        id 'com.android.application' version '9.0.0-rc02'
        id 'org.jetbrains.kotlin.android' version '2.3.0'
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_PROJECT)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "synheart-behavior-android"

include ':example'
project(':example').projectDir = new File(rootDir, 'example')

